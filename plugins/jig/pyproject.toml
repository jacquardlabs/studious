# jig's release line, independent of studious's. Both plugins ship from this one
# repo, so the tag prefix is what keeps the two version lines apart —
# `{plugin-name}--v{version}` is the convention Claude Code parses when resolving a
# version-constrained plugin dependency. `version_variables` paths resolve against
# the process CWD (the repo root in CI), never the directory holding this file.
# .github/workflows/release.yml decides which of the two lines a given push moves.
[tool.semantic_release]
version_variables = ["plugins/jig/.claude-plugin/plugin.json:version"]
tag_format = "jig--v{version}"
commit_message = "chore(release): jig v{version} [skip ci]"
major_on_zero = false
build_command = ""
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Mirrors the rule set CLAUDE.md documents and studious's own idiom rubric
# (reference/idioms/python.md) names as "the linter" for this portfolio:
# bugbear, comprehensions, simplify, perflint, pyflakes-refactor, and
# flake8-pie. `code-auditor`'s judgment layer picks up structural
# recognitions a linter misses; CLAUDE.md conventions override this list.
#
# extend-select, not select: `select` *replaces* ruff's default rule set rather
# than adding to it, which would silently disable Pyflakes and the default
# pycodestyle error checks CLAUDE.md's own checklist calls out (issue #36).
#
# That default set is not fixed — it has grown past the E4/E7/E9/F this comment
# originally named, so `extend-select` inherits whatever the pinned ruff ships.
# .github/workflows/ci.yml pins the version for exactly that reason; bump the pin
# deliberately and fix what the new defaults surface, rather than floating.
extend-select = ["B", "C4", "PERF", "PIE", "RUF", "SIM"]
