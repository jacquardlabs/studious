name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  markdown:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npx -y markdownlint-cli2@0.23.0

  python-checks:
    name: link-check + schema + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Link-check references
        run: uv run --no-project python scripts/check_references.py
      - name: Validate plugin manifests
        run: uv run --no-project python scripts/validate_plugin.py
      - name: Gates never require jig
        run: uv run --no-project python scripts/check_gate_independence.py
      - name: Unit tests
        run: uv run --no-project --with pytest pytest tests/python -v

  build-scripts:
    name: build-script lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      # The build-execution scripts and their unittest suite arrived from jig's own
      # repo, where no CI job of any kind ran them (jig#55, jig#87). ruff is pinned
      # for the same reason markdownlint, eslint, and shellcheck are: its default rule
      # set grows between releases, so an unpinned run turns an upstream release into
      # a surprise red build.
      - name: Ruff
        run: uv run --no-project --with ruff==0.16.0 ruff check scripts tests/jig
      # scripts/ ships to consuming projects and the skills invoke it bare
      # (`scripts/design-lint --doc ...`), so it runs on whatever python3 that
      # project has — not on CI's uv-managed interpreter and not on the 3.11+
      # CLAUDE.md targets for development. 3.9 is the floor because that is what
      # stock macOS provides. #250: design-lint imported itertools.pairwise (3.10)
      # and the traceback read as a malformed design doc rather than a wrong
      # interpreter. Pinned for the same reason every other linter here is.
      - name: Runtime version floor for shipped scripts
        run: uv run --no-project --with vermin==1.8.0 vermin --no-tips -t=3.9- scripts/
      - name: Unit tests
        run: uv run --no-project python3 -m unittest discover -s tests/jig

  ledger:
    name: gate-ledger tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Ensure git and jq are available
        run: |
          command -v git >/dev/null || { echo "git is required but not found" >&2; exit 1; }
          if ! command -v jq >/dev/null; then
            if [ "$RUNNER_OS" = "macOS" ]; then
              brew install jq
            else
              sudo apt-get update && sudo apt-get install -y jq
            fi
          fi
      - name: Gate-ledger integration tests
        run: bash tests/test_gate_ledger.sh
      - name: Evidence-capture hook integration tests
        run: bash tests/test_evidence_capture.sh
      - name: Dispatch-telemetry hook integration tests
        run: bash tests/test_dispatch_telemetry.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
      - run: shellcheck bin/gate-ledger hooks/gate-reminder.sh hooks/evidence-capture.sh hooks/dispatch-telemetry.sh tests/test_gate_ledger.sh tests/test_evidence_capture.sh tests/test_dispatch_telemetry.sh tests/test_workflows_lint.sh scripts/install-dev.sh

  workflows-js:
    name: workflows/ JS checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: node --check
        run: |
          for f in workflows/*.js; do
            node --check "$f"
          done
      - name: eslint
        run: npx -y eslint@10.6.0 --report-unused-disable-directives workflows/
      - name: Lint regression tests (eslint.config.mjs)
        run: bash tests/test_workflows_lint.sh
