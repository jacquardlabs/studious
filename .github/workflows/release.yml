name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write

    # Every input to this job is pinned to an immutable identity — commit SHAs for the
    # actions, exact versions plus hashes for the Python closure. This is the one job
    # holding RELEASE_TOKEN: a PAT carrying contents:write here and a cross-repo
    # workflow dispatch against jacquardlabs/marketplace, so a mutable ref moved
    # upstream would run with the largest privilege the project has (#201).
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # release-requirements.txt pins python-semantic-release and all 29 transitive
      # dependencies with hashes; --require-hashes makes pip reject the install if any
      # line lacks one. To upgrade, bump release-requirements.in and regenerate — the
      # .txt header carries the exact uv command.
      - name: Install python-semantic-release
        run: pip install --require-hashes -r .github/workflows/release-requirements.txt

      - name: Compute version and push tag
        id: version
        run: |
          BEFORE=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          semantic-release version
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "none")
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Released $AFTER (was $BEFORE)"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release (still $AFTER)"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Publish GitHub release
        run: semantic-release publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Push-notify the marketplace to re-pin this plugin's SHA immediately.
      # The marketplace's nightly poll remains the self-healing backstop.
      - name: Notify marketplace to update pins
        if: steps.version.outputs.released == 'true'
        run: gh workflow run update-pins.yml --repo jacquardlabs/marketplace
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
