name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install python-semantic-release
        run: pip install python-semantic-release

      # Two plugins, two version lines, one tree. Each step releases only when that
      # plugin's own files moved since that plugin's own last tag — the gate lives in
      # scripts/release-plugin.sh. studious runs first so jig's run starts from an
      # already-settled main.
      - name: Release studious
        id: studious
        run: scripts/release-plugin.sh studious pyproject.toml 'v' . ':(exclude)plugins/'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Release jig
        id: jig
        run: scripts/release-plugin.sh jig plugins/jig/pyproject.toml 'jig--v' plugins/jig
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Push-notify the marketplace to re-pin the changed plugin's SHA immediately.
      # The marketplace's nightly poll remains the self-healing backstop.
      - name: Notify marketplace to update pins
        if: steps.studious.outputs.released == 'true' || steps.jig.outputs.released == 'true'
        run: gh workflow run update-pins.yml --repo jacquardlabs/marketplace
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
